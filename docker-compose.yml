services:
  redis:
    image: redis:7-alpine
    container_name: nerdearla-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nerdearla-backend
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - TRANSCRIPTION_MODEL=gemini-3.5-transcribe-live-preview
      - TRANSLATION_MODEL=gemini-3.5-live-translate-preview
      - UTILITY_MODEL=gemini-3.5-flash-lite
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-dev-insecure-jwt-secret-at-least-32-chars!}
      - AUTH_JWT_EXPIRES_SECONDS=${AUTH_JWT_EXPIRES_SECONDS:-28800}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nerdearla-frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend
